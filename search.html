<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ابحث في مقالات تِلاد عبر الحضارات والعصور المختلفة.">
<title>بحث — تِلاد TILAD</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='46' fill='none' stroke='%23e9e4d6' stroke-width='3'/%3E%3Cellipse cx='60' cy='60' rx='46' ry='18' fill='none' stroke='%2323a68c' stroke-width='2'/%3E%3Cellipse cx='60' cy='60' rx='18' ry='46' fill='none' stroke='%2323a68c' stroke-width='2'/%3E%3Cpath d='M 32 66 Q 60 46, 88 66' fill='none' stroke='%23b8863f' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='52' cy='80' r='4.5' fill='%23b8863f'/%3E%3Ccircle cx='68' cy='80' r='4.5' fill='%23b8863f'/%3E%3Ccircle cx='60' cy='34' r='4' fill='%23e9e4d6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1a26; --ink-deep:#0a121b; --ink-alt:#1a2836; --ink-line:rgba(233,228,214,0.12);
    --parchment:#e9e4d6; --parchment-dim:rgba(233,228,214,0.62);
    --emerald:#1c6b5c; --emerald-light:#2fa88f; --bronze:#b8863f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink);color:var(--parchment);font-family:'Tajawal',sans-serif;}
  nav{
    position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;
    padding:18px 6%;background:rgba(15,26,38,0.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--ink-line);
  }
  .nav-mark{font-family:'Amiri',serif;font-size:1.3rem;font-weight:700;color:var(--parchment);text-decoration:none;display:flex;align-items:center;gap:8px;}
  .nav-mark-en{font-size:0.6rem;letter-spacing:2px;color:var(--emerald-light);direction:ltr;font-weight:700;}

  .search-head{max-width:640px;margin:0 auto;padding:80px 6% 40px;text-align:center;}
  .search-head h1{font-family:'Amiri',serif;font-size:clamp(2rem,4.5vw,2.8rem);margin-bottom:30px;}
  .search-box{
    display:flex;gap:10px;max-width:520px;margin:0 auto;
  }
  .search-box input{
    flex:1;padding:15px 18px;background:var(--ink-alt);border:1px solid var(--ink-line);
    color:var(--parchment);font-family:'Tajawal',sans-serif;font-size:0.95rem;outline:none;
  }
  .search-box input:focus{border-color:var(--emerald-light);}
  .search-box input::placeholder{color:var(--parchment-dim);}

  .results{max-width:800px;margin:0 auto;padding:20px 6% 100px;}
  .result-card{
    display:block;text-decoration:none;
    padding:22px 0;border-bottom:1px solid var(--ink-line);
  }
  .result-cat{font-size:0.72rem;color:var(--bronze);font-weight:700;letter-spacing:1px;margin-bottom:8px;display:block;}
  .result-card h3{font-family:'Amiri',serif;font-size:1.2rem;color:var(--parchment);margin-bottom:6px;line-height:1.5;}
  .result-card p{font-size:0.85rem;color:var(--parchment-dim);font-weight:300;}
  .no-results{text-align:center;color:var(--parchment-dim);padding:40px 0;font-weight:300;}
  .hint{text-align:center;color:var(--parchment-dim);font-size:0.85rem;margin-top:16px;font-weight:300;}

  footer{
    padding:32px 6%;display:flex;justify-content:space-between;align-items:center;
    font-size:0.82rem;color:var(--parchment-dim);flex-wrap:wrap;gap:12px;
    background:var(--ink-deep);border-top:1px solid var(--ink-line);
  }
  footer .foot-mark{font-family:'Amiri',serif;font-weight:700;color:var(--parchment);}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-mark">تِلاد <span class="nav-mark-en">TILAD</span></a>
</nav>

<div class="search-head">
  <h1>ابحث في تِلاد</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث عن حضارة، حدث، أو شخصية تاريخية...">
  </div>
  <p class="hint">يبحث حاليًا في عناوين المقالات وتصنيفاتها فقط</p>
</div>

<div class="results" id="results"></div>

<footer>
  <div class="foot-mark">تِلاد</div>
  <div>© ٢٠٢٦ جميع الحقوق محفوظة</div>
</footer>

<script>
  /* ============================================================
     فهرس البحث — قائمة ثابتة (بدون سيرفر أو قاعدة بيانات)
     ملاحظة: كل ما تُنشر مقالة جديدة فعليًا، لازم تُضاف سطر جديد
     هنا بنفس الشكل عشان تظهر في نتائج البحث (أداة admin.html
     بتولّدلك السطر ده جاهز تلصقه). لو عدد المقالات كبر كتير
     (أكتر من ٥٠-١٠٠)، يُفضّل الانتقال لفهرس بحث حقيقي (مثل
     Algolia أو Lunr.js) بدل التحديث اليدوي.
  ============================================================ */
  const articles = [
    // لسه مفيش مقالات منشورة — أضف هنا كل مقال جديد بالشكل:
    // { title: "...", category: "...", url: "...", excerpt: "..." },
  ];

  const input = document.getElementById('searchInput');
  const resultsBox = document.getElementById('results');

  function render(list) {
    if (list.length === 0) {
      resultsBox.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة</div>';
      return;
    }
    resultsBox.innerHTML = list.map(a => `
      <a href="${a.url}" class="result-card">
        <span class="result-cat">${a.category}</span>
        <h3>${a.title}</h3>
        <p>${a.excerpt}</p>
      </a>
    `).join('');
  }

  render(articles);

  input.addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    if (q === '') { render(articles); return; }
    const filtered = articles.filter(a =>
      a.title.toLowerCase().includes(q) || a.category.toLowerCase().includes(q)
    );
    render(filtered);
  });
</script>

</body>
</html>
